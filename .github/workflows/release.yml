name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write # Robotun kod yükleyebilmesi (commit atması) için
  issues: write   # Robotun issue'lara yorum yapabilmesi için
  pull-requests: write # PR'lara yorum yapabilmesi için

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Tüm git geçmişini çek (versiyon hesaplamak için şart)
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub'ın otomatik sağladığı anahtar